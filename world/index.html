<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jean Chung — 幾何之谷</title>
  <meta name="description" content="捲動,飛進一座 Monument Valley 風格的幾何世界。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Theme matches the scene renders + the main site's Monument Valley palette */
    :root, .sw-root {
      --sw-bg: #EFDCE3;            /* mid-tone of the scenes' sky gradient */
      --sw-ink: #3F3160;
      --sw-ink-soft: #8E80B8;
      --sw-accent: #B89DD9;
      --sw-font-display: 'Space Grotesk', 'Noto Sans TC', sans-serif;
      --sw-font-body: 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Jean Chung', href: '../' },
      hint: '捲動,飛進世界',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'valley', label: '幾何之谷',
          still: 'assets/scene1.jpg',
          clip: 'assets/vid/dive1.mp4',
          accent: '#E89F8C',
          eyebrow: 'A world to scroll through',
          title: '幾何之谷',
          body: '一座漂浮在暮色裡的小城。捲動不是翻頁,是一台攝影機,正朝塔樓之間飛去。',
          tags: ['等距', '微縮', '暮色'],
        },
        {
          id: 'colonnade', label: '光影迴廊',
          still: 'assets/scene2.jpg',
          clip: 'assets/vid/dive2.mp4',
          accent: '#B89DD9',
          scroll: 1.5, linger: 0.4,
          eyebrow: 'Between the pillars',
          title: '光影迴廊',
          body: '列柱夾出一條通道,盡頭有一扇發著光的小門。愈往前,柱影愈長。',
          tags: ['列柱', '透視'],
        },
        {
          id: 'stairs', label: '無限階梯',
          still: 'assets/scene3.jpg',
          clip: 'assets/vid/dive3.mp4',
          accent: '#A8C4E8',
          eyebrow: 'Step by step',
          title: '無限階梯',
          body: '一階一階往上,直到平台浮在雲的高度。每個顏色,都是一段爬過的路。',
          tags: ['攀升', '漂浮平台'],
        },
        {
          id: 'observatory', label: '圓頂觀星台',
          still: 'assets/scene4.jpg',
          clip: 'assets/vid/dive4.mp4',
          accent: '#F4B5C8',
          scroll: 1.5, linger: 0.4,
          eyebrow: 'Under the first stars',
          title: '圓頂觀星台',
          body: '天色轉暗,星星一顆顆亮起。圓頂裡有一道光,指著更遠的地方。',
          tags: ['星空', '黃昏'],
        },
        {
          id: 'gate', label: '終幕之門',
          still: 'assets/scene5.jpg',
          clip: 'assets/vid/dive5.mp4',
          accent: '#FFE8C8',
          scroll: 1.7, linger: 0.5,
          eyebrow: 'The journey ends here',
          title: '終幕之門',
          body: '門後不是出口,是回程。謝謝你飛完這一趟。',
          tags: [],
          cta: {
            primary: { label: '回到作品集', href: '../' },
            secondary: { label: '再飛一次', href: '#top' },
          },
        },
      ],
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4',
        'assets/vid/conn3.mp4',
        'assets/vid/conn4.mp4',
      ],
    });
  </script>
</body>
</html>
