<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── MONUMENT VALLEY THEME ──────────────────────────── */
const THEME = {
  // Text
  text:       "#3F3160",        // deep plum
  textSoft:   "#5D4E8F",
  textMuted:  "#8E80B8",        // lavender muted

  coral:      "#E89F8C",        // peach/coral architecture
  pink:       "#F4B5C8",        // soft pink
  lavender:   "#B89DD9",        // lavender accents
  sky:        "#A8C4E8",        // sky blue

  deepPurple: "#7B6BA8",        // shadow purple
  // Surfaces
  surfaceLight: "rgba(255, 248, 240, 0.55)",   // frosted cream
  surfaceCard:  "rgba(255, 244, 235, 0.7)",
  navBg:        "rgba(255, 240, 235, 0.6)",
  divider:      "rgba(125, 100, 168, 0.18)",

  tintHero:     "linear-gradient(180deg, rgba(216,229,245,0.0) 0%, rgba(230,213,236,0.0) 100%)",
  tintAbout:    "linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,240,250,0.22) 100%)",

  tintWork:     "linear-gradient(180deg, rgba(244,181,200,0.18) 0%, rgba(184,157,217,0.14) 100%)",
  tintBlog:     "linear-gradient(180deg, rgba(255,232,200,0.28) 0%, rgba(244,181,163,0.20) 100%)",

const FONT_H    = "'Space Grotesk', sans-serif";
const FONT_BODY = "'Noto Sans TC', sans-serif";
const FONT_MONO = "'Space Mono', monospace";

/* ─── ISOMETRIC TOWER (decorative SVG) ───────────────── */
function MvTower({ style, opacity = 1 }) {
  return (
    <svg style={{ position:"absolute", pointerEvents:"none", opacity, ...style }} viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
      {/* Soft shadow under tower */}
      <ellipse cx="110" cy="265" rx="80" ry="8" fill="#B89DD9" opacity="0.25"/>

      {/* Base block */}
      <polygon points="40,220 110,255 180,220 110,185" fill="#E89F8C"/>
      <polygon points="40,220 110,255 110,185" fill="#D88B7A" opacity="0.7"/>
      <polygon points="180,220 110,255 110,185" fill="#F4B5A3"/>

      {/* Mid section */}
      <polygon points="55,180 110,205 165,180 110,155" fill="#F4B5C8"/>
      <polygon points="55,180 110,205 110,155" fill="#E89BB0" opacity="0.7"/>
      <polygon points="165,180 110,205 110,155" fill="#F8C5D4"/>

      {/* Upper block */}
      <polygon points="70,140 110,160 150,140 110,120" fill="#B89DD9"/>
      <polygon points="70,140 110,160 110,120" fill="#9B82C2" opacity="0.7"/>
      <polygon points="150,140 110,160 110,120" fill="#CCB3E5"/>

      {/* Top tower */}
      <polygon points="85,105 110,118 135,105 110,92" fill="#FFE8C8"/>
      <polygon points="85,105 110,118 110,92" fill="#F0D4A8" opacity="0.7"/>
      <polygon points="135,105 110,118 110,92" fill="#FFF2DB"/>

      {/* Pagoda roof */}
      <polygon points="92,92 110,72 128,92" fill="#7B6BA8"/>
      <polygon points="95,72 110,55 125,72" fill="#5D4E8F"/>

      {/* Cherry tree silhouette */}
      <circle cx="78" cy="92" r="10" fill="#F4B5C8" opacity="0.85"/>
      <line x1="78" y1="92" x2="78" y2="105" stroke="#7B6BA8" strokeWidth="1.2"/>
    </svg>
  );
}

/* ─── CLOUD / MIST BLOB ──────────────────────────────── */
function MvCloud({ style, color = "#FFFFFF", opacity = 0.5 }) {
  return (
    <svg style={{ position:"absolute", pointerEvents:"none", opacity, ...style }} viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="50" rx="40" ry="22" fill={color}/>
      <ellipse cx="95" cy="42" rx="48" ry="28" fill={color}/>
      <ellipse cx="145" cy="50" rx="42" ry="24" fill={color}/>
    </svg>
  );
}

/* ─── BACKGROUND PAGODA SILHOUETTES ──────────────────── */
function BgSilhouettes() {
  return (
    <svg
      style={{
        position:"fixed", inset:0, width:"100vw", height:"100vh",
        pointerEvents:"none", zIndex:0, opacity:0.18,
      }}
      viewBox="0 0 1200 800"
      preserveAspectRatio="xMidYMax meet"
      xmlns="http://www.w3.org/2000/svg"
    >
      {/* Far back pagoda silhouettes */}
      <g fill="#B89DD9">
        <polygon points="60,800 60,580 130,540 200,580 200,800"/>
        <polygon points="50,540 130,500 210,540 130,500"/>
        <polygon points="130,500 130,460 110,440 150,440 130,420"/>
        <polygon points="950,800 950,560 1030,520 1110,560 1110,800"/>
        <polygon points="940,520 1030,478 1120,520"/>

      <g fill="#8E80B8" opacity="0.65">

      <g fill="#7B6BA8" opacity="0.45">
        <polygon points="0,800 0,720 150,680 350,720 550,690 800,720 1050,690 1200,720 1200,800"/>
      </g>
    </svg>
  );
}

/* ─── NAVIGATION ─────────────────────────────────────── */
function Nav({ activeSection }) {
  const links = [
    { id:"about",     label:"關於 About" },
    { id:"resume",    label:"履歷 Resume" },
    { id:"portfolio", label:"作品 Work" },
    { id:"blog",      label:"文章 Blog" },
  ];
  return (
    <nav style={{
      position:"fixed", top:0, left:0, right:0, zIndex:100,
      background:THEME.navBg, backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)",
      borderBottom:`1px solid ${THEME.divider}`,
      display:"flex", alignItems:"center", justifyContent:"space-between",
      padding:"0 clamp(24px,5vw,80px)", height:"64px",
    }}>
      <span style={{ fontFamily:FONT_H, fontSize:"18px", fontWeight:600, letterSpacing:"-0.02em", color:THEME.coral }}>
        Jean Chung
      </span>
      <div style={{ display:"flex", gap:"clamp(20px,3vw,44px)", alignItems:"center" }}>
        {links.map(l => (
          <a key={l.id} href={`#${l.id}`} style={{
            fontFamily:FONT_H, fontSize:"13px",
            fontWeight: activeSection === l.id ? 600 : 400,
            letterSpacing:"0.01em",
            color: activeSection === l.id ? THEME.coral : THEME.textMuted,
            textDecoration:"none",
            borderBottom: activeSection === l.id ? `2px solid ${THEME.coral}` : "2px solid transparent",
            paddingBottom:"3px", transition:"color 0.25s ease, border-color 0.25s ease",

    </nav>
  );
}

            boxShadow:"0 8px 24px rgba(232,159,140,0.35)",
            transition:"transform 0.25s ease, box-shadow 0.25s ease",
          }}

            fontFamily:FONT_H, fontSize:"13px", letterSpacing:"0.06em", fontWeight:500,
            padding:"15px 38px",

            color:THEME.deepPurple,
            background:"rgba(255,255,255,0.4)",
            textDecoration:"none", display:"inline-block",

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"clamp(40px,6vw,100px)", alignItems:"start", marginTop:"64px" }}>

/* ─── APP ────────────────────────────────────────────── */
function App() {
  const [activeSection, setActiveSection] = useState("about");

  useEffect(() => {
    const ids = ["about","resume","portfolio","blog"];
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActiveSection(e.target.id); });
    }, { threshold:0.35 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  return (
    <div>
      <BgSilhouettes />
      <Nav activeSection={activeSection} />
      <Hero />
      <About />
      <Resume />
      <Portfolio />
      <Blog />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
