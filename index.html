<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jean Chung — 前端工程師</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>

<!-- SVG watercolor filters — only used on decorative blobs, NOT on buttons/cards -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="wc-decor" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.018 0.025" numOctaves="4" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="7"/>
    </filter>
    <filter id="wc-decor2" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.022 0.018" numOctaves="4" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="G" yChannelSelector="R" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="10"/>
    </filter>
    <filter id="wc-decor3" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.03" numOctaves="3" seed="47" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="B" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="14"/>
    </filter>
  </defs>
</svg>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── THEMES ─────────────────────────────────────────── */
const THEMES = {
  washi: {
    bg:"#F6F0E6", bgDeep:"#EDE4D4",
    text:"#2A1F10", textMuted:"#7A6850",
    primary:"#8C1A1A", accent:"#C4A882", accentLight:"#DDD0B8",
    navBg:"rgba(246,240,230,0.92)", cardBg:"rgba(255,252,246,0.85)",
    blob1:"rgba(140,26,26,0.13)", blob2:"rgba(196,168,130,0.25)", blob3:"rgba(140,26,26,0.08)",
    divider:"rgba(42,31,16,0.10)",
    introBg:"#0E0A06", introGrid:"rgba(196,168,130,0.12)", introAccent:"#C4A882",
  },
  sumi: {
    bg:"#141008", bgDeep:"#1E1610",
    text:"#F0E8D8", textMuted:"#9A8870",
    primary:"#D45050", accent:"#C4A882", accentLight:"#6A5840",
    navBg:"rgba(20,16,8,0.92)", cardBg:"rgba(30,22,14,0.85)",
    blob1:"rgba(212,80,80,0.18)", blob2:"rgba(196,168,130,0.16)", blob3:"rgba(212,80,80,0.10)",
    divider:"rgba(240,232,216,0.08)",
    introBg:"#0E0A06", introGrid:"rgba(212,80,80,0.10)", introAccent:"#D45050",
  },
};

const FONT_H    = "'Space Grotesk', sans-serif";
const FONT_BODY = "'Noto Sans TC', sans-serif";
const FONT_MONO = "'Space Mono', monospace";

/* ─── WATERCOLOR DECORATIONS ─────────────────────────── */
function WcSplash({ style, theme, variant = 0 }) {
  const sets = [
    [[120,100,90,70,theme.blob1,"wc-decor"],[200,160,60,50,theme.blob2,"wc-decor2"],[80,190,50,40,theme.blob3,"wc-decor3"]],
    [[80,80,70,55,theme.blob2,"wc-decor2"],[160,130,80,60,theme.blob1,"wc-decor"],[200,60,40,35,theme.blob3,"wc-decor3"]],
    [[100,120,100,75,theme.blob1,"wc-decor3"],[60,60,55,45,theme.blob2,"wc-decor"]],
  ];
  const s = sets[variant % sets.length];
  return (
    <svg style={{ position:"absolute", pointerEvents:"none", ...style }} viewBox="0 0 280 240" xmlns="http://www.w3.org/2000/svg">
      {s.map(([x,y,rx,ry,color,f],i) => (
        <ellipse key={i} cx={x} cy={y} rx={rx} ry={ry} fill={color} filter={`url(#${f})`} />
      ))}
    </svg>
  );
}

/* ─── INTRO ANIMATION ────────────────────────────────── */
function IntroAnimation({ theme, onDone }) {
  const canvasRef  = useRef(null);
  const mouseRef   = useRef({ x: -9999, y: -9999 });
  const runningRef = useRef(true);
  const [phase,   setPhase]   = useState("particles");
  const [typed,   setTyped]   = useState("");
  const [visible, setVisible] = useState(true);
  const TARGET = "JEAN CHUNG";

  const COL1 = theme.introAccent;
  const COL2 = theme.primary || "#D45050";

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    const N = Math.min(Math.floor((canvas.width * canvas.height) / 14000), 100);
    const particles = Array.from({ length: N }, () => {
      const useCol2 = Math.random() < 0.35;
      return {
        x:  Math.random() * canvas.width,
        y:  Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        r:  Math.random() * 2.5 + 1,
        color: useCol2 ? COL2 : COL1,
        alpha: Math.random() * 0.5 + 0.5,
        pulse: Math.random() * Math.PI * 2,
      };
    });

    const LINK_DIST   = 130;
    const MOUSE_DIST  = 120;
    const MOUSE_FORCE = 2.5;

    function draw() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      const mx = mouseRef.current.x;
      const my = mouseRef.current.y;

      particles.forEach(p => {
        p.pulse += 0.025;
        const glowPulse = 0.7 + 0.3 * Math.sin(p.pulse);
        const dx = p.x - mx, dy = p.y - my;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < MOUSE_DIST && dist > 0.1) {
          const force = (MOUSE_DIST - dist) / MOUSE_DIST * MOUSE_FORCE;
          p.vx += (dx / dist) * force * 0.04;
          p.vy += (dy / dist) * force * 0.04;
        }
        p.vx *= 0.985; p.vy *= 0.985;
        p.x  += p.vx;  p.y  += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

        ctx.save();
        ctx.globalAlpha = p.alpha * glowPulse;
        ctx.shadowBlur  = 16 * glowPulse;
        ctx.shadowColor = p.color;
        ctx.fillStyle   = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * glowPulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 6;
        ctx.globalAlpha = p.alpha * glowPulse * 0.8;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d  = Math.sqrt(dx*dx + dy*dy);
          if (d > LINK_DIST) continue;
          const opacity = (1 - d / LINK_DIST) * 0.45;
          ctx.save();
          ctx.globalAlpha = opacity;
          ctx.shadowBlur  = 8;
          ctx.shadowColor = a.color;
          ctx.strokeStyle = a.color;
          ctx.lineWidth   = 0.8;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.restore();
        }
      }

      if (mx > 0 && my > 0) {
        const rg = ctx.createRadialGradient(mx, my, 0, mx, my, 80);
        rg.addColorStop(0, COL1 + "22");
        rg.addColorStop(1, "transparent");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(mx, my, 80, 0, Math.PI * 2);
        ctx.fill();
      }

      if (runningRef.current) raf = requestAnimationFrame(draw);
    }
    draw();

    return () => {
      runningRef.current = false;
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
    };
  }, [COL1, COL2]);

  useEffect(() => {
    const onMove = e => { mouseRef.current = { x: e.clientX, y: e.clientY }; };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, []);

  useEffect(() => {
    const t = setTimeout(() => setPhase("type"), 1200);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (phase !== "type") return;
    if (typed.length < TARGET.length) {
      const t = setTimeout(() => setTyped(TARGET.slice(0, typed.length + 1)), 65);
      return () => clearTimeout(t);
    } else {
      const t = setTimeout(() => setPhase("exit"), 900);
      return () => clearTimeout(t);
    }
  }, [phase, typed]);

  useEffect(() => {
    if (phase !== "exit") return;
    runningRef.current = false; // stop canvas RAF immediately on exit
    const t = setTimeout(() => { setVisible(false); onDone(); }, 800);
    return () => clearTimeout(t);
  }, [phase]);

  if (!visible) return null;

  return (
    <div style={{
      position:"fixed", inset:0, zIndex:999,
      background:"#080504",
      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
      transition: phase === "exit" ? "opacity 0.8s ease" : "none",
      opacity: phase === "exit" ? 0 : 1,
      cursor:"none",
    }}>
      <canvas ref={canvasRef} style={{ position:"absolute", inset:0, width:"100%", height:"100%" }} />

      {phase !== "particles" && (
        <div style={{ position:"relative", zIndex:2, textAlign:"center", userSelect:"none" }}>
          <div style={{ position:"relative", display:"inline-block" }}>
            <h1 style={{
              fontFamily:FONT_H,
              fontSize:"clamp(54px,8vw,104px)",
              fontWeight:700, letterSpacing:"-0.04em",
              color:"transparent",
              lineHeight:1,
              WebkitTextStroke:`1px ${COL1}`,
              textShadow:`0 0 40px ${COL1}80, 0 0 80px ${COL1}40`,
              minWidth:"4ch",
            }}>
              {typed}
              <span style={{ animation:"blink 0.7s step-end infinite" }}>|</span>
            </h1>
            <h1 aria-hidden="true" style={{
              fontFamily:FONT_H,
              fontSize:"clamp(54px,8vw,104px)",
              fontWeight:700, letterSpacing:"-0.04em",
              color:COL1,
              lineHeight:1,
              position:"absolute", top:0, left:0, width:"100%",
              opacity:0.25,
              filter:`blur(12px)`,
              pointerEvents:"none",
            }}>{typed}</h1>
          </div>

          <div style={{
            fontFamily:FONT_MONO, fontSize:"11px", letterSpacing:"0.28em",
            color:COL1, marginTop:"20px", opacity:0.55,
            textShadow:`0 0 10px ${COL1}`,
          }}>
            FRONTEND ENGINEER · 前端工程師
          </div>
        </div>
      )}

      <div style={{ position:"absolute", bottom:"28px", left:0, right:0, display:"flex", justifyContent:"space-between", padding:"0 36px", zIndex:2 }}>
        <span style={{ fontFamily:FONT_MONO, fontSize:"10px", color:COL1, opacity:0.3 }}>JC · PORTFOLIO</span>
        <span style={{ fontFamily:FONT_MONO, fontSize:"10px", color:COL1, opacity:0.3 }}>2026</span>
      </div>
    </div>
  );
}

/* ─── NAVIGATION ─────────────────────────────────────── */
function Nav({ theme, activeSection, themeName, onToggleTheme }) {
  const links = [
    { id:"about",     label:"關於 About" },
    { id:"resume",    label:"履歷 Resume" },
    { id:"portfolio", label:"作品 Work" },
    { id:"blog",      label:"文章 Blog" },
  ];
  return (
    <nav style={{
      position:"fixed", top:0, left:0, right:0, zIndex:100,
      background:theme.navBg, backdropFilter:"blur(16px)",
      borderBottom:`1px solid ${theme.divider}`,
      display:"flex", alignItems:"center", justifyContent:"space-between",
      padding:"0 clamp(24px,5vw,80px)", height:"60px",
    }}>
      <span style={{ fontFamily:FONT_H, fontSize:"18px", fontWeight:600, letterSpacing:"-0.02em", color:theme.primary }}>
        Jean Chung
      </span>
      <div style={{ display:"flex", gap:"clamp(20px,3vw,44px)", alignItems:"center" }}>
        {links.map(l => (
          <a key={l.id} href={`#${l.id}`} style={{
            fontFamily:FONT_H, fontSize:"13px",
            fontWeight: activeSection === l.id ? 600 : 400,
            letterSpacing:"0.01em",
            color: activeSection === l.id ? theme.primary : theme.textMuted,
            textDecoration:"none",
            borderBottom: activeSection === l.id ? `2px solid ${theme.primary}` : "2px solid transparent",
            paddingBottom:"2px", transition:"all 0.25s ease",
          }}>{l.label}</a>
        ))}
        <button
          onClick={onToggleTheme}
          title={themeName === "sumi" ? "切換淺色 Light mode" : "切換深色 Dark mode"}
          style={{
            fontFamily:FONT_MONO, fontSize:"10px", letterSpacing:"0.12em",
            color:theme.textMuted, background:"transparent",
            border:`1px solid ${theme.divider}`, cursor:"pointer",
            padding:"5px 12px", transition:"all 0.25s",
          }}
          onMouseEnter={e => { e.currentTarget.style.color = theme.primary; e.currentTarget.style.borderColor = theme.primary; }}
          onMouseLeave={e => { e.currentTarget.style.color = theme.textMuted; e.currentTarget.style.borderColor = theme.divider; }}
        >
          {themeName === "sumi" ? "☀" : "☽"}
        </button>
      </div>
    </nav>
  );
}

/* ─── HERO ───────────────────────────────────────────── */
function Hero({ theme, show }) {
  return (
    <section style={{
      minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center",
      position:"relative", overflow:"hidden",
      background:theme.bg, padding:"80px clamp(24px,8vw,120px) 60px",
    }}>
      <WcSplash style={{ top:"-60px", right:"-40px", width:"440px", height:"380px", opacity:0.85 }} theme={theme} variant={0} />
      <WcSplash style={{ bottom:"0", left:"-80px", width:"380px", height:"320px", opacity:0.65 }} theme={theme} variant={1} />

      <div style={{ maxWidth:"800px", position:"relative", zIndex:1,
        opacity: show ? 1 : 0, transform: show ? "none" : "translateY(20px)",
        transition:"opacity 0.9s ease 0.1s, transform 0.9s ease 0.1s",
      }}>
        <div style={{ fontFamily:FONT_MONO, fontSize:"11px", letterSpacing:"0.25em", color:theme.accent, marginBottom:"32px", display:"flex", alignItems:"center", gap:"12px" }}>
          <span style={{ display:"inline-block", width:"32px", height:"1px", background:theme.accent }}></span>
          前端工程師 · Frontend Engineer
        </div>

        <h1 style={{ fontFamily:FONT_H, fontSize:"clamp(60px,8.5vw,116px)", fontWeight:700, lineHeight:0.95, color:theme.text, letterSpacing:"-0.04em", marginBottom:"4px" }}>
          Jean
        </h1>
        <h1 style={{ fontFamily:FONT_H, fontSize:"clamp(60px,8.5vw,116px)", fontWeight:300, lineHeight:0.95, color:theme.primary, letterSpacing:"-0.04em", marginBottom:"44px" }}>
          Chung
        </h1>

        <p style={{ fontFamily:FONT_BODY, fontSize:"clamp(15px,1.7vw,18px)", fontWeight:300, lineHeight:1.9, color:theme.textMuted, maxWidth:"460px", marginBottom:"52px", letterSpacing:"0.03em" }}>
          6 年以上前端開發經驗，專注 React 生態系、效能優化與 Web3 應用。<br/>
          <span style={{ fontFamily:FONT_H, fontSize:"0.88em", fontWeight:400, color:theme.textMuted + "BB" }}>
            6+ years building performant web apps — from crypto exchanges to DeFi DApps.
          </span>
        </p>

        <div style={{ display:"flex", gap:"14px", flexWrap:"wrap" }}>
          <a href="#portfolio" style={{
            fontFamily:FONT_H, fontSize:"13px", letterSpacing:"0.05em", fontWeight:600,
            padding:"14px 36px", background:theme.primary, color:"#FAF5EC",
            textDecoration:"none", display:"inline-block",
            transition:"opacity 0.2s",
          }}
          onMouseEnter={e=>e.currentTarget.style.opacity="0.8"}
          onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
            作品集 Work →
          </a>
          <a href="#about" style={{
            fontFamily:FONT_H, fontSize:"13px", letterSpacing:"0.05em", fontWeight:400,
            padding:"14px 36px",
            border:`1px solid ${theme.accent}`,
            color:theme.textMuted,
            textDecoration:"none", display:"inline-block",
            transition:"border-color 0.2s, color 0.2s",
          }}
          onMouseEnter={e=>{ e.currentTarget.style.borderColor=theme.primary; e.currentTarget.style.color=theme.primary; }}
          onMouseLeave={e=>{ e.currentTarget.style.borderColor=theme.accent; e.currentTarget.style.color=theme.textMuted; }}>
            關於我 About
          </a>
        </div>

        <div style={{ position:"absolute", bottom:"-200px", left:0, display:"flex", flexDirection:"column", alignItems:"flex-start", gap:"8px" }}>
          <span style={{ fontFamily:FONT_MONO, fontSize:"10px", color:theme.textMuted, letterSpacing:"0.15em" }}>scroll</span>
          <div style={{ width:"1px", height:"56px", background:`linear-gradient(to bottom,${theme.accent},transparent)` }}></div>
        </div>
      </div>
    </section>
  );
}

/* ─── ABOUT ──────────────────────────────────────────── */
function About({ theme }) {
  const sectionRef = useRef(null);
  const blobRef    = useRef(null);
  const photoRef   = useRef(null);
  const textRef    = useRef(null);

  useEffect(() => {
    let rafId = null;
    function onScroll() {
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        const el = sectionRef.current;
        if (el) {
          const progress = -el.getBoundingClientRect().top / window.innerHeight;
          if (blobRef.current)  blobRef.current.style.transform  = `translateY(${progress * 60}px)`;
          if (photoRef.current) photoRef.current.style.transform = `translateY(${progress * -30}px)`;
          if (textRef.current)  textRef.current.style.transform  = `translateY(${progress * -15}px)`;
        }
        rafId = null;
      });
    }
    window.addEventListener("scroll", onScroll, { passive:true });
    return () => { window.removeEventListener("scroll", onScroll); if (rafId) cancelAnimationFrame(rafId); };
  }, []);

  const skills = ["React","TypeScript","Vue","Next.js","Tailwind","ethers.js","Node.js","Docker"];

  return (
    <section id="about" ref={sectionRef} style={{
      background:theme.bgDeep, padding:"130px clamp(24px,8vw,120px)",
      position:"relative", overflow:"hidden",
    }}>
      <div ref={blobRef} style={{ position:"absolute", inset:0, pointerEvents:"none", willChange:"transform" }}>
        <WcSplash style={{ top:"-40px", left:"45%", width:"520px", height:"420px", opacity:0.45 }} theme={theme} variant={2} />
        <WcSplash style={{ bottom:"-60px", left:"-60px", width:"360px", height:"300px", opacity:0.3 }} theme={theme} variant={0} />
      </div>

      <div style={{ maxWidth:"960px", margin:"0 auto", position:"relative", zIndex:1 }}>
        <SectionTitle theme={theme} en="About" ja="自己紹介" zh="關於我" />

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"clamp(40px,6vw,100px)", alignItems:"start", marginTop:"64px" }}>

          <div ref={photoRef} style={{ willChange:"transform" }}>
            <div style={{
              width:"100%", aspectRatio:"4/5",
              background:theme.accentLight,
              overflow:"hidden", position:"relative",
              display:"flex", alignItems:"center", justifyContent:"center",
            }}>
              <svg style={{ width:"70%", height:"70%", opacity:0.35 }} viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="80" r="45" fill={theme.accent} opacity="0.6"/>
                <ellipse cx="100" cy="200" rx="70" ry="60" fill={theme.accent} opacity="0.4"/>
              </svg>
              <span style={{ position:"absolute", bottom:"14px", left:"50%", transform:"translateX(-50%)", fontFamily:FONT_MONO, fontSize:"9px", color:theme.textMuted, letterSpacing:"0.12em", whiteSpace:"nowrap" }}>Jean Chung</span>
            </div>
          </div>

          <div ref={textRef} style={{ paddingTop:"8px", willChange:"transform" }}>
            <p style={{ fontFamily:FONT_BODY, fontSize:"clamp(15px,1.6vw,17px)", fontWeight:300, lineHeight:2.0, color:theme.text, letterSpacing:"0.04em", marginBottom:"20px" }}>
              你好，我是 Jean。擁有 6 年以上前端開發經驗，曾參與加密貨幣交易所、DeFi 去中心化應用及線上遊戲平台的開發。熱衷於效能優化、乾淨的程式架構，以及與設計師緊密協作打造流暢的使用者體驗。
            </p>
            <p style={{ fontFamily:FONT_H, fontSize:"clamp(14px,1.5vw,16px)", fontWeight:400, lineHeight:1.75, color:theme.textMuted, marginBottom:"40px" }}>

/* ─── APP ────────────────────────────────────────────── */
function App() {
  const [themeName, setThemeName] = useState("sumi");
  const theme = THEMES[themeName];
  const [introDone, setIntroDone] = useState(false);
  const [activeSection, setActiveSection] = useState("about");

  useEffect(() => {
    document.body.style.background = theme.bg;
  }, [theme.bg]);

  useEffect(() => {
    if (!introDone) return;
    const ids = ["about","resume","portfolio","blog"];
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActiveSection(e.target.id); });
    }, { threshold:0.35 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [introDone]);

  return (
    <div>
      <IntroAnimation theme={theme} onDone={() => setIntroDone(true)} />
      {introDone && (
        <Nav
          theme={theme}
          activeSection={activeSection}
          themeName={themeName}
          onToggleTheme={() => setThemeName(t => t === "sumi" ? "washi" : "sumi")}
        />
      )}
      <Hero theme={theme} show={introDone} />
      <About theme={theme} />
      <Resume theme={theme} />
      <Portfolio theme={theme} />
      <Blog theme={theme} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
