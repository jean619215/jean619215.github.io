<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jean Chung — 前端工程師</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/89/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      overflow-x: hidden;
      color: #ffffff;
      background: #000000; /* fallback before fixed-bg layer paints */
      min-height: 100vh;
    }
    /* Fixed gradient backdrop on its own compositor layer — far cheaper
       than background-attachment:fixed (which repaints on every scroll). */
    .bg-gradient {
      position: fixed; inset: 0; z-index: -2;
      background: linear-gradient(180deg,
        #000000 0%, #08000c 30%, #0d0014 60%, #12001a 100%);
      will-change: transform;
      transform: translateZ(0);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,0,200,0.45); border-radius: 3px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalPop {
      from { opacity: 0; transform: translateY(22px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .modal-panel { animation: none !important; }
    }
    @keyframes livePulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,0,200,0.7); }
      70%  { box-shadow: 0 0 0 6px rgba(255,0,200,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,0,200,0); }
    }
    .hero-ch { display: inline-block; will-change: transform; }
    @keyframes introBounce {
      0%, 100% { transform: translateY(0); opacity: 0.85; }
      50% { transform: translateY(10px); opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .intro-hint { animation: none !important; }
      .site-nav { transition: none !important; }
    }
    .site-nav { transform: translateY(-110%); transition: transform 0.5s cubic-bezier(0.22,1,0.36,1); }
    .site-nav.nav-visible { transform: translateY(0); }
    /* ─── Gradient buttons — animated radial gradient + gradient border ───
       Uses @property so the color/position custom properties are typed and
       therefore interpolatable; the whole gradient animates on hover. */
    @property --pos-x   { syntax: '<percentage>'; initial-value: 11.14%;  inherits: false; }
    @property --pos-y   { syntax: '<percentage>'; initial-value: 140%;    inherits: false; }
    @property --spread-x{ syntax: '<percentage>'; initial-value: 150%;    inherits: false; }
    @property --spread-y{ syntax: '<percentage>'; initial-value: 180.06%; inherits: false; }
    @property --color-1 { syntax: '<color>'; initial-value: #000000; inherits: false; }
    @property --color-2 { syntax: '<color>'; initial-value: #12002b; inherits: false; }
    @property --color-3 { syntax: '<color>'; initial-value: #3d0a52; inherits: false; }
    @property --color-4 { syntax: '<color>'; initial-value: #6b0f66; inherits: false; }
    @property --color-5 { syntax: '<color>'; initial-value: #a4126f; inherits: false; }
    @property --border-angle   { syntax: '<angle>'; initial-value: 20deg; inherits: true; }
    @property --border-color-1 { syntax: '<color>'; initial-value: hsla(316, 100%, 70%, 0.25); inherits: true; }
    @property --border-color-2 { syntax: '<color>'; initial-value: hsla(316, 100%, 55%, 0.80); inherits: true; }
    @property --stop-1 { syntax: '<percentage>'; initial-value: 37.35%; inherits: false; }
    @property --stop-2 { syntax: '<percentage>'; initial-value: 61.36%; inherits: false; }
    @property --stop-3 { syntax: '<percentage>'; initial-value: 78.42%; inherits: false; }
    @property --stop-4 { syntax: '<percentage>'; initial-value: 89.52%; inherits: false; }
    @property --stop-5 { syntax: '<percentage>'; initial-value: 100%;   inherits: false; }

    .grad-btn {
      position: relative;
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      white-space: nowrap;
      background: radial-gradient(
        var(--spread-x) var(--spread-y) at var(--pos-x) var(--pos-y),
        var(--color-1) var(--stop-1),
        var(--color-2) var(--stop-2),
        var(--color-3) var(--stop-3),
        var(--color-4) var(--stop-4),
        var(--color-5) var(--stop-5)
      );
      transition:
        --pos-x 0.5s, --pos-y 0.5s, --spread-x 0.5s, --spread-y 0.5s,
        --color-1 0.5s, --color-2 0.5s, --color-3 0.5s, --color-4 0.5s, --color-5 0.5s,
        --border-angle 0.5s, --border-color-1 0.5s, --border-color-2 0.5s,
        --stop-1 0.5s, --stop-2 0.5s, --stop-3 0.5s, --stop-4 0.5s, --stop-5 0.5s,
        box-shadow 0.4s ease;
    }
    .grad-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(var(--border-angle), var(--border-color-1), var(--border-color-2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }
    .grad-btn:hover {
      --pos-x: 0%;
      --pos-y: 91.51%;
      --spread-x: 120.24%;
      --spread-y: 103.18%;
      --color-1: #ff00c8;
      --color-2: #d10bb4;
      --color-3: #9000ff;
      --color-4: #2a0338;
      --color-5: #000000;
      --border-angle: 190deg;
      --border-color-1: hsla(316, 100%, 90%, 0.15);
      --border-color-2: hsla(316, 100%, 80%, 0.85);
      --stop-1: 0%;
      --stop-2: 8.8%;
      --stop-3: 21.44%;
      --stop-4: 71.34%;
      --stop-5: 85.76%;
      box-shadow: 0 10px 30px rgba(255, 0, 200, 0.45);
    }
    /* Secondary tone — cyan/purple instead of magenta */
    .grad-btn-alt {
      --color-1: #000010;
      --color-2: #0a1a3d;
      --color-3: #14405e;
      --color-4: #0f6e78;
      --color-5: #00e5ff;
      --border-angle: 200deg;
      --border-color-1: hsla(187, 100%, 80%, 0.55);
      --border-color-2: hsla(265, 90%, 70%, 0.25);
    }
    .grad-btn-alt:hover {
      --pos-x: 0%;
      --pos-y: 95.51%;
      --spread-x: 110.24%;
      --spread-y: 110.2%;
      --color-1: #000018;
      --color-2: #00e5ff;
      --color-3: #2a8fd6;
      --color-4: #9000ff;
      --color-5: #000000;
      --stop-1: 0%;
      --stop-2: 10%;
      --stop-3: 35.44%;
      --stop-4: 71.34%;
      --stop-5: 90.76%;
      --border-angle: 210deg;
      --border-color-1: hsla(187, 100%, 90%, 0.25);
      --border-color-2: hsla(265, 90%, 85%, 0.80);
      box-shadow: 0 10px 30px rgba(0, 229, 255, 0.32);
    }
    @media (prefers-reduced-motion: reduce) {
      .grad-btn { transition: none; }
    }

    /* ─── Portfolio skewed card stack (reference: stacked testimonial cards) ─── */
    .pf-stack {
      display: grid;
      grid-template-areas: "stack";
      justify-content: start;
      align-items: start;
    }
    .pf3d {
      grid-area: stack;
      width: min(420px, 82vw);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease;
      will-change: transform;
    }
    @media (prefers-reduced-motion: reduce) {
      .pf3d { transition: none; }
    }
    @media (max-width: 700px) {
      .pf-stack { display: flex; flex-direction: column; gap: 24px; align-items: center; padding-left: 0 !important; }
      .pf3d { transform: none !important; filter: none !important; }
    }

    /* ─── Resume scroll-reveal (sticky timeline + detail panel) ─── */
    .rv-runway { height: 280vh; position: relative; }
    .rv-sticky { position: sticky; top: 0; height: 100vh; display: flex; align-items: center; }
    .rv-cols {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: clamp(32px, 5vw, 88px); width: 100%; align-items: center;
    }
    .rv-item { transition: opacity 0.3s ease; }
    .rv-panel { position: absolute; inset: 0; opacity: 0; transition: opacity 0.35s ease; display: flex; flex-direction: column; justify-content: center; pointer-events: none; }
    .rv-panel.rv-panel-active { opacity: 1; pointer-events: auto; }
    .rv-mobile-desc { display: none; }
    @media (max-width: 900px) {
      .rv-runway { height: auto; }
      .rv-sticky { position: static; height: auto; }
      .rv-cols { grid-template-columns: 1fr; }
      .rv-detail-col { display: none; }
      .rv-mobile-desc { display: block; }
      .rv-item { opacity: 1 !important; }
    }

    /* ─── Spotlight cards — glow follows pointer (CSS vars set from JS) ─── */
    .spot-card { position: relative; }
    .spot-card::before, .spot-card::after {
      content: ""; position: absolute; inset: -1px; border-radius: inherit;
      pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
    }
    /* border ring — gradient masked to a 1.5px edge */
    .spot-card::before {
      background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255,0,200,0.9), rgba(144,0,255,0.4) 45%, transparent 70%);
      padding: 1.5px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
    }
    /* soft interior glow */
    .spot-card::after {
      background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255,0,200,0.10), transparent 60%);
    }
    body.spot-on .spot-card::before, body.spot-on .spot-card::after { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .spot-card::before, .spot-card::after { transition: none; }
    }
    .grad-ch {
      background: linear-gradient(135deg, #ff00c8 0%, #9000ff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    #scroll-progress {
      position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200;
      background: linear-gradient(90deg, #ff00c8 0%, #9000ff 100%);
      transform: scaleX(0); transform-origin: left center; pointer-events: none;
    }
  </style>
</head>
<body>

<div class="bg-gradient" aria-hidden="true"></div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── NEON MAGENTA THEME ─────────────────────────────── */
const THEME = {
  // Text
  text:       "#ffffff",
  textSoft:   "#cfcfcf",
  textMuted:  "#aaaaaa",
  // Brand colors
  coral:      "#ff00c8",        // primary neon magenta
  pink:       "#ff4fd8",        // lighter magenta
  lavender:   "#9000ff",        // electric purple
  sky:        "#00e5ff",        // neon cyan
  cream:      "#ffe600",        // neon yellow
  deepPurple: "#ff00c8",        // primary accent (was shadow purple)
  // Surfaces
  surfaceLight: "rgba(255, 255, 255, 0.04)",
  surfaceCard:  "rgba(255, 255, 255, 0.05)",
  navBg:        "rgba(0, 0, 0, 0.78)",
  divider:      "rgba(255, 255, 255, 0.14)",
  // Section tints (overlays on top of body gradient)
  tintHero:     "linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 100%)",
  tintAbout:    "linear-gradient(180deg, rgba(255,0,200,0.03) 0%, rgba(144,0,255,0.05) 100%)",
  tintResume:   "linear-gradient(180deg, rgba(144,0,255,0.05) 0%, rgba(0,229,255,0.03) 100%)",
  tintWork:     "linear-gradient(180deg, rgba(255,0,200,0.06) 0%, rgba(144,0,255,0.04) 100%)",
  tintBlog:     "linear-gradient(180deg, rgba(255,230,0,0.03) 0%, rgba(255,0,200,0.05) 100%)",
};

const FONT_H    = "'Outfit', 'Noto Sans TC', sans-serif";
const FONT_BODY = "'Outfit', 'Noto Sans TC', sans-serif";
const FONT_MONO = "'Fira Code', monospace";

/* ─── ISOMETRIC ARCHITECTURE (Monument Valley style) ─── */
function MvTower({ style, opacity = 1 }) {
  // Color palette (cream / pink / lavender architecture)
  const c = {
    creamTop: "#FFF2DB",   creamL: "#F2DDB8",  creamR: "#FFE8C8",
    peachTop: "#F8C8B0",   peachL: "#E89F8C",  peachR: "#F4B5A3",
    pinkTop:  "#F8C5D4",   pinkL:  "#E89BB0",  pinkR:  "#F4B5C8",
    lavTop:   "#CCB3E5",   lavL:   "#9B82C2",  lavR:   "#B89DD9",
    flag:     "#E0526A",
    pole:     "#5D4E8F",
    shadow:   "#7B6BA8",
    stair:    "#D88B7A",
  };

  return (
    <svg style={{ position:"absolute", pointerEvents:"none", opacity, ...style }} viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
      {/* Soft ground shadow */}
      <ellipse cx="120" cy="305" rx="95" ry="10" fill={c.shadow} opacity="0.22"/>

      {/* ── Wide base platform ── */}
      <polygon points="30,270 120,310 210,270 120,230" fill={c.creamTop}/>
      <polygon points="30,270 120,310 120,260" fill={c.creamL} opacity="0.85"/>
      <polygon points="210,270 120,310 120,260" fill={c.creamR}/>
      {/* base front edge */}
      <polygon points="30,270 120,310 120,260 30,225" fill={c.creamL} opacity="0.6"/>

      {/* ── Side terrace (right) ── */}
      <polygon points="135,250 195,280 195,255 135,225" fill={c.peachL} opacity="0.85"/>
      <polygon points="135,225 195,255 175,245 135,225" fill={c.peachTop}/>
      <polygon points="135,250 195,280 195,255" fill={c.peachR}/>

      {/* ── Stair on left side ── */}
      {[0,1,2,3].map(i => (
        <g key={i}>
          <polygon
            points={`${42 + i*10},${245 - i*8} ${72 + i*10},${260 - i*8} ${72 + i*10},${254 - i*8} ${42 + i*10},${239 - i*8}`}
            fill={c.stair} opacity="0.55"
          />
          <polygon
            points={`${42 + i*10},${239 - i*8} ${72 + i*10},${254 - i*8} ${72 + i*10},${248 - i*8} ${42 + i*10},${233 - i*8}`}
            fill={c.peachTop}
          />
        </g>
      ))}

      {/* ── Main square tower (middle) ── */}
      <polygon points="75,220 120,245 165,220 120,195" fill={c.creamTop}/>
      <polygon points="75,220 120,245 120,160 75,135" fill={c.creamL}/>
      <polygon points="165,220 120,245 120,160 165,135" fill={c.creamR}/>
      <polygon points="75,135 120,160 165,135 120,110" fill={c.creamTop}/>

      {/* arched window on left face */}
      <path d="M 88,200 L 88,180 Q 92,172 100,176 L 100,212 Z" fill={c.lavL} opacity="0.55"/>
      {/* arched window on right face */}
      <path d="M 140,176 Q 148,172 152,180 L 152,200 L 140,212 Z" fill={c.peachL} opacity="0.55"/>

      {/* ── Pink mid tier ── */}
      <polygon points="85,115 120,135 155,115 120,95" fill={c.pinkTop}/>
      <polygon points="85,115 120,135 120,80 85,60" fill={c.pinkL}/>
      <polygon points="155,115 120,135 120,80 155,60" fill={c.pinkR}/>
      <polygon points="85,60 120,80 155,60 120,40" fill={c.pinkTop}/>

      {/* small window on pink tier */}
      <rect x="94" y="92" width="6" height="14" fill={c.shadow} opacity="0.55"/>
      <rect x="140" y="92" width="6" height="14" fill={c.shadow} opacity="0.55"/>

      {/* ── Lavender top spire ── */}
      <polygon points="100,45 120,55 140,45 120,35" fill={c.lavTop}/>
      <polygon points="100,45 120,55 120,15 100,5" fill={c.lavL}/>
      <polygon points="140,45 120,55 120,15 140,5" fill={c.lavR}/>
      <polygon points="100,5 120,15 140,5 120,-5" fill={c.lavTop}/>

      {/* ── Flag pole + flag at top ── */}
      <line x1="120" y1="-5" x2="120" y2="-35" stroke={c.pole} strokeWidth="2"/>
      <path d="M 120,-32 L 150,-26 L 145,-20 L 150,-14 L 120,-18 Z" fill={c.flag}/>

      {/* ── Small attached pavilion (right) ── */}
      <polygon points="175,185 200,200 200,165 175,150" fill={c.lavL} opacity="0.85"/>
      <polygon points="175,150 200,165 215,158 190,143" fill={c.lavTop}/>
      <polygon points="200,165 200,200 215,193 215,158" fill={c.lavR} opacity="0.85"/>
      {/* pavilion roof flag */}
      <line x1="195" y1="143" x2="195" y2="128" stroke={c.pole} strokeWidth="1.2"/>
      <path d="M 195,140 L 210,137 L 207,133 L 210,128 L 195,131 Z" fill={c.flag}/>

      {/* ── Connecting walkway/bridge ── */}
      <polygon points="155,180 175,170 175,165 155,175" fill={c.creamR} opacity="0.9"/>
      <polygon points="155,180 175,170 175,175 155,185" fill={c.creamL} opacity="0.7"/>
    </svg>
  );
}

/* ─── FLUFFY CLOUD (Monument Valley style — stacked puffs) ─ */
function MvCloud({ style, color = "#FFFFFF", opacity = 0.65 }) {
  /* Neon theme — clouds become faint magenta/purple mist on black */
  return (
    <svg className="mv-cloud" style={{ position:"absolute", pointerEvents:"none", opacity: opacity * 0.3, ...style }} viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id={`cl-${color.replace(/[^a-z0-9]/gi,"")}`} cx="50%" cy="40%" r="60%">
          <stop offset="0%" stopColor="#ff00c8" stopOpacity="0.55"/>
          <stop offset="100%" stopColor="#9000ff" stopOpacity="0"/>
        </radialGradient>
      </defs>
      <g fill={`url(#cl-${color.replace(/[^a-z0-9]/gi,"")})`}>
        {/* Base flat row */}
        <ellipse cx="120" cy="82" rx="100" ry="14"/>
        {/* Lower puffs */}
        <circle cx="40"  cy="72" r="22"/>
        <circle cx="70"  cy="64" r="28"/>
        <circle cx="200" cy="72" r="22"/>
        <circle cx="170" cy="62" r="28"/>
        {/* Mid puffs */}
        <circle cx="105" cy="52" r="34"/>
        <circle cx="145" cy="50" r="32"/>
        {/* Top puffs */}
        <circle cx="120" cy="32" r="26"/>
        <circle cx="90"  cy="42" r="22"/>
        <circle cx="155" cy="38" r="20"/>
      </g>
      {/* Soft highlight */}
      <ellipse cx="115" cy="28" rx="20" ry="8" fill="#ff00c8" opacity="0.25"/>
    </svg>
  );
}

/* ─── PENROSE TRIANGLE (Hero impossible figure) ──────── */
function PenroseTriangle({ style, opacity = 1 }) {
  // Three colored bars folded into an impossible triangle.
  // Each bar shows three faces (top / left-front / right-front) shaded differently.
  return (
    <svg style={{ position:"absolute", pointerEvents:"none", opacity, ...style }} viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        {/* Soft drop shadow */}
        <filter id="penrose-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
          <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
          <feFlood floodColor="#7B6BA8" floodOpacity="0.18"/>
          <feComposite in2="offsetBlur" operator="in"/>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <g filter="url(#penrose-shadow)">
        {/* Bottom bar (coral / pink) */}
        <polygon points="60,225 240,225 222,210 78,210" fill="#FFE8C8"/>
        <polygon points="60,225 240,225 222,240 78,240" fill="#E89F8C"/>
        <polygon points="60,225 78,210 78,240" fill="#F4B5A3"/>
        <polygon points="240,225 222,210 222,240" fill="#D88B7A"/>

        {/* Left bar (lavender) — rising from bottom-left to top */}
        <polygon points="60,225 150,75 132,75 78,210" fill="#CCB3E5"/>
        <polygon points="60,225 78,210 78,225" fill="#9B82C2"/>
        <polygon points="150,75 132,75 132,90" fill="#B89DD9"/>
        <polygon points="78,210 132,75 132,90 78,225" fill="#B89DD9"/>

        {/* Right bar (pink) — rising from bottom-right back up to top */}
        <polygon points="240,225 150,75 168,75 222,210" fill="#F8C5D4"/>

/* ─── SHADER INTRO (Three.js full-screen opening) ────── */
function ShaderIntro() {
  const containerRef = useRef(null);

  useEffect(() => {
    const container = containerRef.current;
    if (!container || !window.THREE) return;
    const THREE = window.THREE;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const camera = new THREE.Camera();
    camera.position.z = 1;
    const scene = new THREE.Scene();
    const geometry = new THREE.PlaneBufferGeometry(2, 2);

    const uniforms = {
      time: { type: "f", value: 1.0 },
      resolution: { type: "v2", value: new THREE.Vector2() },
    };

    const vertexShader = `
      void main() {
        gl_Position = vec4( position, 1.0 );
      }
    `;

    const fragmentShader = `
      precision highp float;
      uniform vec2 resolution;
      uniform float time;

      float random (in float x) {
          return fract(sin(x)*1e4);
      }

      void main(void) {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);

        vec2 fMosaicScal = vec2(4.0, 2.0);
        vec2 vScreenSize = vec2(256.0, 256.0);
        uv.x = floor(uv.x * vScreenSize.x / fMosaicScal.x) / (vScreenSize.x / fMosaicScal.x);
        uv.y = floor(uv.y * vScreenSize.y / fMosaicScal.y) / (vScreenSize.y / fMosaicScal.y);

        float t = time*0.06+random(uv.x)*0.4;
        float lineWidth = 0.0008;

        vec3 intensity = vec3(0.0);
        for(int j = 0; j < 3; j++){
          for(int i = 0; i < 5; i++){
            intensity[j] += lineWidth*float(i*i) / abs(fract(t - 0.01*float(j)+float(i)*0.01)*1.0 - length(uv));
          }
        }

        /* Neon palette — each intensity layer mapped to a brand color */
        vec3 magenta = vec3(1.0, 0.0, 0.784);   /* #ff00c8 */
        vec3 purple  = vec3(0.565, 0.0, 1.0);   /* #9000ff */
        vec3 cyan    = vec3(0.0, 0.898, 1.0);   /* #00e5ff */
        vec3 color = intensity[0]*magenta + intensity[1]*purple + intensity[2]*cyan;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
    scene.add(new THREE.Mesh(geometry, material));

    const renderer = new THREE.WebGLRenderer();
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    renderer.domElement.style.display = "block";

    const onResize = () => {
      const rect = container.getBoundingClientRect();
      renderer.setSize(rect.width, rect.height, false);
      uniforms.resolution.value.x = renderer.domElement.width;
      uniforms.resolution.value.y = renderer.domElement.height;
    };
    onResize();
    window.addEventListener("resize", onResize);

    let raf = null;
    const animate = () => {
      raf = requestAnimationFrame(animate);
      uniforms.time.value += 0.05;
      renderer.render(scene, camera);
    };
    if (reduceMotion) {
      renderer.render(scene, camera);
    } else {
      animate();
    }

    return () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      geometry.dispose();
      material.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
    };
  }, []);

  const scrollToContent = () => {
    window.scrollTo({ top: window.innerHeight, behavior: "smooth" });
  };

  return (
    <section id="intro" style={{
      position:"relative", height:"100vh", overflow:"hidden", background:"#000",
    }}>
      <div ref={containerRef} style={{ position:"absolute", inset:0 }} />

      <div className="intro-copy" style={{
        position:"absolute", inset:0, zIndex:2,
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
        pointerEvents:"none", textAlign:"center", padding:"0 24px",
      }}>
        <h1 style={{
          fontFamily:FONT_H, fontSize:"clamp(48px,8vw,110px)", fontWeight:700,
          color:"#FFFFFF", letterSpacing:"-0.03em", lineHeight:1.1,
          textShadow:"0 0 40px rgba(0,0,0,0.6)",
        }}>
          Jean Chung
        </h1>
        <p style={{
          fontFamily:FONT_MONO, fontSize:"clamp(11px,1.4vw,14px)", letterSpacing:"0.32em",
          color:"rgba(255,255,255,0.05)", marginTop:"18px", textTransform:"uppercase",
        }}>
          Front-end · Full-stack Engineer
        </p>
      </div>

      <button className="intro-hint" onClick={scrollToContent} aria-label="Scroll to content" style={{
        position:"absolute", bottom:"36px", left:"50%", marginLeft:"-60px", width:"120px",
        zIndex:3, background:"none", border:"none", cursor:"pointer",
        color:"rgba(255,255,255,0.85)", fontFamily:FONT_MONO, fontSize:"11px",
        letterSpacing:"0.28em", textTransform:"uppercase",
        display:"flex", flexDirection:"column", alignItems:"center", gap:"10px",
        animation:"introBounce 2.2s ease-in-out infinite",
      }}>
        <span>Scroll</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 4v16" /><path d="M6 14l6 6 6-6" />
        </svg>

/* ─── PARTICLE TEXT (canvas particle text, mouse-repel) ──
   lines: [{ text, weight, colors: [c] | [c1, c2] }] — multi-color = gradient.
   sizer(containerWidth) → font size. Used for the hero name and section titles. */
function ParticleText({ lines, sizer, heading = "h2", label, style }) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);

  useEffect(() => {
    const wrap = wrapRef.current, canvas = canvasRef.current;
    if (!wrap || !canvas) return;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const ctx = canvas.getContext("2d");
    let particles = [];
    let raf = null;
    let running = false;
    const mouse = { x: -9999, y: -9999 };

    const build = () => {
      const basis = (wrap.parentElement && wrap.parentElement.clientWidth) || wrap.clientWidth;
      const fs = sizer(basis);
      const lineH = fs * 1.12;
      const h = Math.round(lineH * (lines.length - 1) + fs * 1.35);
      let maxW = 0;
      lines.forEach(L => {
        ctx.font = `${L.weight} ${fs}px Outfit, sans-serif`;
        maxW = Math.max(maxW, ctx.measureText(L.text).width);
      });
      const w = Math.max(10, Math.min(basis, Math.ceil(maxW + fs * 0.12)));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      /* draw source text, sample pixels, spawn particles */
      ctx.clearRect(0, 0, w, h);
      ctx.textBaseline = "alphabetic";
      lines.forEach((L, li) => {
        if (L.colors.length > 1) {
          const grad = ctx.createLinearGradient(0, li * lineH, w, (li + 1) * lineH);
          L.colors.forEach((c, ci) => grad.addColorStop(ci / (L.colors.length - 1), c));
          ctx.fillStyle = grad;
        } else {
          ctx.fillStyle = L.colors[0];
        }
        ctx.font = `${L.weight} ${fs}px Outfit, sans-serif`;
        ctx.fillText(L.text, 0, fs * 0.92 + li * lineH);
      });

      const data = ctx.getImageData(0, 0, w * dpr, h * dpr).data;
      ctx.clearRect(0, 0, w, h);
      particles = [];
      const gap = Math.max(3, Math.round(fs / 26));
      for (let y = 0; y < h; y += gap) {
        for (let x = 0; x < w; x += gap) {
          const i = ((y * dpr | 0) * (w * dpr) + (x * dpr | 0)) * 4;
          if (data[i + 3] > 128) {
            particles.push({
              x: reduce ? x : Math.random() * w,
              y: reduce ? y : Math.random() * h,
              bx: x, by: y,
              vx: 0, vy: 0,
              r: gap * 0.42,
              color: `rgb(${data[i]},${data[i + 1]},${data[i + 2]})`,
            });
          }
        }
      }
    };

    const tick = () => {
      raf = requestAnimationFrame(tick);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const dist2 = dx * dx + dy * dy;
        const R = 92;
        if (dist2 < R * R) {
          const dist = Math.sqrt(dist2) || 1;
          const force = (R - dist) / R;
          p.vx += (dx / dist) * force * 6;
          p.vy += (dy / dist) * force * 6;
        }
        p.vx += (p.bx - p.x) * 0.06;
        p.vy += (p.by - p.y) * 0.06;
        p.vx *= 0.82;
        p.vy *= 0.82;
        p.x += p.vx;
        p.y += p.vy;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.r * 2, p.r * 2);
      }
    };

    const drawStatic = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.bx, p.by, p.r * 2, p.r * 2);
      }
    };

    const start = () => {
      if (running) return;
      running = true;
      if (reduce) { drawStatic(); } else { tick(); }
    };
    const stop = () => {
      running = false;
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    };

    const onMove = (e) => {
      const r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left;
      mouse.y = e.clientY - r.top;
    };
    const onLeave = () => { mouse.x = -9999; mouse.y = -9999; };

    /* build once fonts are ready so sampling uses Outfit, not the fallback */
    const init = () => { build(); if (visible) start(); };
    let visible = false;
    const io = new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      if (visible && particles.length) start();
      if (!visible) stop();
    }, { threshold: 0.15 });
    io.observe(wrap);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(init);
    } else {
      init();
    }

    const onResize = () => { build(); if (reduce) drawStatic(); };
    window.addEventListener("resize", onResize);
    window.addEventListener("pointermove", onMove, { passive: true });
    window.addEventListener("pointerleave", onLeave);

    return () => {
      stop();
      io.disconnect();
      window.removeEventListener("resize", onResize);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerleave", onLeave);
    };
  }, []);

  const Heading = heading;
  return (
    <div ref={wrapRef} className="pt-wrap" style={style}>
      <Heading style={{
        position:"absolute", width:"1px", height:"1px", overflow:"hidden",
        clip:"rect(0 0 0 0)", whiteSpace:"nowrap", margin:0,
      }}>{label}</Heading>
      <canvas ref={canvasRef} aria-hidden="true" style={{ display:"block" }} />
    </div>
  );
}

/* ─── PORTFOLIO ──────────────────────────────────────── */
function Portfolio() {
  const [expanded, setExpanded] = useState(null);   // project being shown
  const [phase, setPhase] = useState("closed");     // closed | opening | open | closing
  const [hoveredIdx, setHoveredIdx] = useState(null); // stack hover — spreads cards below
  const [autoIdx, setAutoIdx] = useState(null);       // idle light-up cycle
  const sectionRef = useRef(null);

  /* Take turns lighting cards up while the section is in view and idle */
  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let timer = null;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !timer) {
        timer = setInterval(() => {
          setAutoIdx(i => (i === null ? 0 : (i + 1) % PORTFOLIO.length));
        }, 2200);
      } else if (!entry.isIntersecting && timer) {
        clearInterval(timer); timer = null;
      }
    }, { threshold: 0.25 });
    obs.observe(section);
    return () => { obs.disconnect(); if (timer) clearInterval(timer); };
  }, []);
  const overlayRef = useRef(null);
  const panelRef   = useRef(null);
  const headRef    = useRef(null);                  // cover image header inside the panel
  const originRef  = useRef(null);                  // { rect, el } of source card

  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const openFrom = (p, el) => {
    if (phase !== "closed") return;
    originRef.current = { rect: el.getBoundingClientRect(), el };
    el.style.visibility = "hidden";
    setExpanded(p);
    setPhase("opening");
  };

  const requestClose = () => {
    if (phase !== "open" || !panelRef.current) return;
    setPhase("closing");
    const { rect, el } = originRef.current;
    const d = reduceMotion() ? 0 : 1;
    gsap.timeline({
      onComplete: () => { el.style.visibility = ""; setExpanded(null); setPhase("closed"); },
    })
      .to(headRef.current, { height: "100%", duration: 0.3 * d, ease: "power2.inOut" })
      .to(panelRef.current, {
        left: rect.left, top: rect.top, width: rect.width, height: rect.height,
        duration: 0.4 * d, ease: "power3.inOut",
      }, "-=0.1")
      .to(panelRef.current, { skewY: -8, duration: 0.25 * d, ease: "power2.in" }, "-=0.12")
      .to(overlayRef.current, { opacity: 0, duration: 0.3 * d }, "-=0.2");
  };

  /* Expand: straighten skew → grow to centered panel → cover shrinks into a
     header (shared-element morph, like the expandable-card reference) */
  useEffect(() => {
    if (phase !== "opening" || !panelRef.current || !overlayRef.current) return;
    const { rect } = originRef.current;
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.min(1100, vw - 40);
    const h = Math.min(vh * 0.9, vh - 32);
    const d = reduceMotion() ? 0 : 1;

    gsap.set(panelRef.current, {
      left: rect.left, top: rect.top, width: rect.width, height: rect.height,
      skewY: -8, transformOrigin: "center center",
    });
    gsap.set(headRef.current, { height: "100%" });
    gsap.fromTo(overlayRef.current, { opacity: 0 }, { opacity: 1, duration: 0.35 * d });
    gsap.timeline({ onComplete: () => setPhase("open") })
      .to(panelRef.current, { skewY: 0, duration: 0.3 * d, ease: "power2.out" })
      .to(panelRef.current, {
        left: (vw - w) / 2, top: (vh - h) / 2, width: w, height: h,
        duration: 0.5 * d, ease: "power3.inOut",
      }, "-=0.08")
      .to(headRef.current, {
        height: 104,
        duration: 0.35 * d, ease: "power3.inOut",
      }, "-=0.05");
  }, [phase]);

  /* Escape to close + scroll lock while expanded */
  useEffect(() => {
    if (!expanded) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = e => { if (e.key === "Escape") requestClose(); };
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener("keydown", onKey);
    };
  }, [expanded, phase]);

  return (
    <section id="portfolio" ref={sectionRef} style={{
      background:THEME.tintAbout, padding:"120px clamp(24px,8vw,120px)",
      position:"relative", overflow:"hidden",
    }}>

      <div style={{ maxWidth:"1160px", margin:"0 auto", position:"relative", zIndex:1 }}>
        <SectionTitle en="Portfolio" ja="作品" zh="作品集" />

        {/* Skewed diagonal card stack — click a card to expand it */}
        <div
          className="pf-stack"
          style={{
            marginTop:"48px",
            /* reserve room for the diagonal offsets + center the whole stack */
            minHeight:`${470 + (PORTFOLIO.length - 1) * 96}px`,
            paddingBottom:"40px",
            paddingLeft:`max(0px, calc(50% - ${(420 + (PORTFOLIO.length - 1) * 120) / 2}px))`,
          }}
          onMouseLeave={() => setHoveredIdx(null)}
        >
          {/* oldest first so the newest project lands at the front-right of the stack */}
          {PORTFOLIO.slice().reverse().map((p, i) => {
            const spread = hoveredIdx !== null && i > hoveredIdx ? 96 : 0;
            const lift = hoveredIdx === i ? -16 : 0;
            /* hover wins; otherwise the idle cycle lights cards up in turn */
            const focusIdx = hoveredIdx !== null ? hoveredIdx
              : autoIdx !== null ? autoIdx
              : PORTFOLIO.length - 1;
            const focused = i === focusIdx;
            return (
              <div
                key={p.slug}
                className="pf3d"
                onMouseEnter={() => setHoveredIdx(i)}
                style={{
                  zIndex: hoveredIdx === i ? 20 : i + 1,
                  transform: `translate(${i * 120}px, ${i * 88 + spread + lift}px) skewY(-8deg)`,
                  filter: focused ? "none" : "grayscale(0.85) brightness(0.72)",
                }}
              >
                <div className="pf-float" style={{
                  borderRadius:"22px",
                  boxShadow: focused ? "0 18px 48px rgba(255,0,200,0.26)" : "none",
                  transition:"box-shadow 0.5s ease",
                }}>
                  <PortfolioCard p={p} onOpen={openFrom} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Expansion overlay — card morphs into the detail panel */}
      {expanded && (
        <div
          ref={overlayRef}
          onClick={requestClose}
          style={{
            position:"fixed", inset:0, zIndex:1000,
            background:"rgba(0, 0, 0, 0.72)",
            backdropFilter:"blur(8px)", WebkitBackdropFilter:"blur(8px)",
            opacity:0,
          }}
        >
          <div
            ref={panelRef}
            onClick={e => e.stopPropagation()}
            style={{
              position:"fixed",
              background:"linear-gradient(180deg, rgba(12,12,12,0.98) 0%, rgba(20,0,26,0.98) 100%)",
              border:`1px solid ${THEME.divider}`,
              borderRadius:"24px",
              overflow:"hidden",
              boxShadow:"0 24px 80px rgba(255,0,200,0.18)",
              display:"flex", flexDirection:"column",
            }}
          >
            {/* Cover header — morphs into a compact dark title bar once open */}
            <div ref={headRef} style={{ position:"relative", width:"100%", height:"100%", flexShrink:0, overflow:"hidden" }}>
              <img
                src={expanded.images[0]}
                alt={expanded.title}
                style={{
                  position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"cover",
                  opacity: phase === "open" ? 0.1 : 1,
                  transition:"opacity 0.4s ease",
                }}
              />
              <div style={{
                position:"absolute", inset:0,
                background: phase === "open"
                  ? "linear-gradient(180deg, rgba(8,4,12,0.85) 0%, rgba(10,4,14,0.96) 100%)"
                  : "linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.78) 100%)",
                transition:"background 0.4s ease",
                borderBottom:`1px solid ${THEME.divider}`,
              }}/>
              <div style={{ position:"absolute", left:"clamp(20px,3vw,40px)", bottom:"16px", right:"70px" }}>
                <div style={{ fontFamily:FONT_H, fontSize:"clamp(20px,2.6vw,28px)", fontWeight:700, color:"#fff", letterSpacing:"-0.02em", lineHeight:1.15 }}>{expanded.title}</div>
                <div style={{ fontFamily:FONT_H, fontSize:"clamp(11px,1.4vw,14px)", fontWeight:500, color:THEME.pink, marginTop:"2px" }}>{expanded.en}</div>
              </div>
            </div>

            {/* Close button */}
            <button
              onClick={requestClose}
              aria-label="Close"
              style={{
                position:"absolute", top:"16px", right:"16px", zIndex:3,
                width:"40px", height:"40px", borderRadius:"50%",
                background:"rgba(22,22,22,0.95)",
                border:`1px solid ${THEME.divider}`,
                cursor:"pointer",
                fontFamily:FONT_H, fontSize:"18px", fontWeight:500, color:THEME.deepPurple,
                display:"flex", alignItems:"center", justifyContent:"center",
                transition:"background 0.2s, transform 0.2s",
              }}
              onMouseEnter={e => { e.currentTarget.style.background = THEME.coral; e.currentTarget.style.color = "#fff"; e.currentTarget.style.transform = "rotate(90deg)"; }}
              onMouseLeave={e => { e.currentTarget.style.background = "rgba(22,22,22,0.95)"; e.currentTarget.style.color = THEME.deepPurple; e.currentTarget.style.transform = "none"; }}
            >×</button>

            {/* Detail content — scrolls under the header */}
            <div style={{
              flex:1, minHeight:0,
              overflow: phase === "open" ? "auto" : "hidden",
              opacity: phase === "open" ? 1 : 0,
              transition:"opacity 0.3s ease",
            }}>
              <ProjectDetailBody p={expanded} />
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

/* ─── PROJECT DETAIL MODAL ───────────────────────────── */
function ProjectDetailBody({ p }) {
  const [idx, setIdx] = useState(0);

  useEffect(() => {
    setIdx(0);
    const onKey = e => {
      if (e.key === "ArrowRight") setIdx(i => Math.min(i + 1, p.images.length - 1));
      if (e.key === "ArrowLeft")  setIdx(i => Math.max(i - 1, 0));
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [p]);

  return (
    <div style={{ padding:"clamp(28px, 4vw, 56px)", paddingTop:"32px" }}>
          {/* Main image */}
          <div style={{
            width:"100%", aspectRatio:"16/10",
            background:"#F4ECE0",
            borderRadius:"16px", overflow:"hidden",
            marginBottom:"16px",
            position:"relative",
            border:`1px solid ${THEME.divider}`,
          }}>
            <img
              src={p.images[idx]}
              alt={`${p.title} ${idx+1}`}
              style={{ width:"100%", height:"100%", objectFit:"contain" }}
            />
            {p.images.length > 1 && (
              <>
                <button
                  onClick={() => setIdx(i => Math.max(i - 1, 0))}
                  disabled={idx === 0}
                  aria-label="Previous"
                  style={{
                    position:"absolute", left:"12px", top:"50%", transform:"translateY(-50%)",
                    width:"40px", height:"40px", borderRadius:"50%",
                    background:"rgba(22,22,22,0.9)", border:"none",
                    cursor: idx === 0 ? "default" : "pointer",
                    opacity: idx === 0 ? 0.35 : 1,
                    fontFamily:FONT_H, fontSize:"18px", color:THEME.deepPurple,
                    boxShadow:"0 4px 12px rgba(63,49,96,0.2)",
                  }}
                >‹</button>
                <button
                  onClick={() => setIdx(i => Math.min(i + 1, p.images.length - 1))}
                  disabled={idx === p.images.length - 1}
                  aria-label="Next"
                  style={{
                    position:"absolute", right:"12px", top:"50%", transform:"translateY(-50%)",
                    width:"40px", height:"40px", borderRadius:"50%",
                    background:"rgba(22,22,22,0.9)", border:"none",
                    cursor: idx === p.images.length - 1 ? "default" : "pointer",
                    opacity: idx === p.images.length - 1 ? 0.35 : 1,
                    fontFamily:FONT_H, fontSize:"18px", color:THEME.deepPurple,
                    boxShadow:"0 4px 12px rgba(63,49,96,0.2)",
                  }}
                >›</button>
              </>
            )}
          </div>

          {/* Thumbnail strip */}
          {p.images.length > 1 && (
            <div style={{ display:"flex", gap:"8px", marginBottom:"32px", flexWrap:"wrap" }}>
              {p.images.map((src, i) => (
                <button
                  key={i}
                  onClick={() => setIdx(i)}
                  aria-label={`Image ${i+1}`}
                  style={{
                    width:"80px", height:"56px",
                    borderRadius:"8px", overflow:"hidden",
                    border: i === idx ? `2px solid ${THEME.coral}` : `1px solid ${THEME.divider}`,
                    background:"transparent",
                    cursor:"pointer",
                    padding:0,
                    transition:"border-color 0.2s",
                  }}
                >
                  <img src={src} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }}/>
                </button>
              ))}
            </div>
          )}

          {/* Description */}
          <div style={{
            fontFamily:FONT_BODY, fontSize:"15px", fontWeight:400, lineHeight:1.9,
            color:THEME.text, letterSpacing:"0.03em", marginBottom:"32px",
          }}>
            {p.desc}
          </div>

          {/* Tech tags */}
          <div style={{ marginBottom:"28px" }}>
            <div style={{ fontFamily:FONT_MONO, fontSize:"10px", letterSpacing:"0.22em", color:THEME.coral, marginBottom:"12px" }}>
              — TECH
            </div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:"8px" }}>
              {p.tech.map(t => (
                <span key={t} style={{
                  fontFamily:FONT_H, fontSize:"12px", fontWeight:500, letterSpacing:"0.04em",
                  padding:"6px 14px", borderRadius:"999px",
                  background:`${THEME.lavender}22`, color:THEME.deepPurple,
                  border:`1px solid ${THEME.lavender}50`,
                }}>{t}</span>
              ))}
            </div>
          </div>

          {/* Demo videos */}
          {p.videos && p.videos.length > 0 && (
            <div style={{ marginBottom:"28px" }}>
              <div style={{ fontFamily:FONT_MONO, fontSize:"10px", letterSpacing:"0.22em", color:THEME.coral, marginBottom:"12px" }}>
                — DEMO VIDEOS
              </div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:"8px" }}>
                {p.videos.map((v,i) => (
                  <a key={i} href={v.url} target="_blank" rel="noopener noreferrer"
                    style={{
                      fontFamily:FONT_H, fontSize:"12px", fontWeight:500, letterSpacing:"0.03em",
                      padding:"8px 14px", borderRadius:"999px",
                      background:`${THEME.coral}15`, color:THEME.coral,
                      border:`1px solid ${THEME.coral}40`,
                      textDecoration:"none",
                      transition:"background 0.2s, color 0.2s",
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background = THEME.coral; e.currentTarget.style.color = "#fff"; }}
                    onMouseLeave={e => { e.currentTarget.style.background = `${THEME.coral}15`; e.currentTarget.style.color = THEME.coral; }}
                  >▶ {v.label}</a>
                ))}
              </div>
            </div>
          )}

          {/* Links */}
          {(p.git || p.demo || p.doc) && (
            <div style={{ display:"flex", flexWrap:"wrap", gap:"12px", paddingTop:"24px", borderTop:`1px solid ${THEME.divider}` }}>
              {p.demo && (
                <a href={p.demo} target="_blank" rel="noopener noreferrer" className={linkBtnClass(true)} style={linkBtnStyle(THEME, true)}>
                  Live demo →

              )}
              {p.git && (
                <a href={p.git} target="_blank" rel="noopener noreferrer" className={linkBtnClass(false)} style={linkBtnStyle(THEME, false)}>
                  GitHub →
                </a>
              )}
              {p.doc && (
                <a href={p.doc} target="_blank" rel="noopener noreferrer" className={linkBtnClass(false)} style={linkBtnStyle(THEME, false)}>
                  Document →
                </a>
              )}
            </div>
          )}
    </div>
  );
}

/* ─── APP ────────────────────────────────────────────── */
function App() {
  const [activeSection, setActiveSection] = useState("resume");

  useEffect(() => {
    const ids = ["resume","portfolio","contact"];
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActiveSection(e.target.id); });
    }, { threshold:0.35 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  /* ─── Spotlight cards — pointer-tracked glow (rAF-throttled) ─── */
  useEffect(() => {
    let raf = null;
    let px = 0, py = 0;

    const update = () => {
      raf = null;
      document.querySelectorAll(".spot-card").forEach(card => {
        const r = card.getBoundingClientRect();
        if (r.bottom < -400 || r.top > window.innerHeight + 400) return;
        card.style.setProperty("--mx", `${px - r.left}px`);
        card.style.setProperty("--my", `${py - r.top}px`);
      });
    };

    const onMove = (e) => {
      px = e.clientX; py = e.clientY;
      document.body.classList.add("spot-on");
      if (!raf) raf = requestAnimationFrame(update);
    };

    window.addEventListener("pointermove", onMove, { passive: true });
    return () => {
      window.removeEventListener("pointermove", onMove);
      if (raf) cancelAnimationFrame(raf);
      document.body.classList.remove("spot-on");
    };
  }, []);

  /* ─── GSAP animations ─── */
  useEffect(() => {
    if (!window.gsap || !window.ScrollTrigger) return;
    gsap.registerPlugin(ScrollTrigger);
    const mm = gsap.matchMedia();

    mm.add("(prefers-reduced-motion: no-preference)", () => {

      /* Intro → hero transition — copy drifts up, shader dissolves into page tint */
      gsap.to(".intro-copy", {
        yPercent: -35, autoAlpha: 0, ease: "none",
        scrollTrigger: { trigger: "#intro", start: "top top", end: "bottom 35%", scrub: true },
      });
      gsap.to(".intro-hint", {
        autoAlpha: 0, ease: "none",
        scrollTrigger: { trigger: "#intro", start: "top top", end: "20% top", scrub: true },
      });
      gsap.to("#intro-fade", {
        opacity: 1, ease: "none",
        scrollTrigger: { trigger: "#intro", start: "20% top", end: "bottom top", scrub: true },
      });
      gsap.from(".hero-inner", {
        y: 90, ease: "none",
        scrollTrigger: { trigger: "#hero", start: "top bottom", end: "top 30%", scrub: true },
      });

      /* Hero intro timeline — staggered char rise (fires when hero scrolls into view) */
      const intro = gsap.timeline({
        defaults: { ease: "power3.out" },
        scrollTrigger: { trigger: ".hero-sub", start: "top 85%", once: true },
      });
      intro
        .from(".hero-sub", { y: 24, autoAlpha: 0, duration: 0.7 })
        .from(".hero-cta > a", {
          y: 18, autoAlpha: 0, scale: 0.92,
          duration: 0.5, ease: "back.out(2)", stagger: 0.12,
        }, "-=0.35");

      /* Clouds — endless drift + scroll parallax */
      gsap.utils.toArray(".mv-cloud").forEach((cloud, i) => {
        gsap.to(cloud, {
          x: i % 2 ? -28 : 28,
          duration: 6 + i * 1.3,
          ease: "sine.inOut", repeat: -1, yoyo: true,
        });
        gsap.to(cloud, {
          y: -60,
          ease: "none",
          scrollTrigger: {
            trigger: cloud.parentElement,
            start: "top bottom", end: "bottom top", scrub: 1.2,
          },
        });
      });

      /* Section titles — heading rises, gradient line draws in */
      gsap.utils.toArray(".sec-title").forEach((el) => {
        const line = el.querySelector(".sec-line");
        const tl = gsap.timeline({
          scrollTrigger: { trigger: el, start: "top 85%", once: true },
        });
        tl.from(el.querySelector(".sec-head"), {
          y: 42, autoAlpha: 0, duration: 0.8, ease: "power3.out",
        });
        if (line) tl.from(line, { scaleX: 0, duration: 0.9, ease: "power2.inOut" }, "-=0.5");
      });

      /* Cards — batched stagger reveal */
      [".rv-card", ".pf-card"].forEach((sel) => {
        const items = gsap.utils.toArray(sel);
        if (!items.length) return;
        gsap.set(items, { y: 44, autoAlpha: 0 });
        ScrollTrigger.batch(items, {
          start: "top 88%",
          once: true,
          onEnter: (batch) => gsap.to(batch, {
            y: 0, autoAlpha: 1,
            duration: 0.75, ease: "power3.out", stagger: 0.12,
            clearProps: "transform,visibility,opacity",
          }),
        });
      });

      /* Portfolio stack — gentle float on inner layer (React owns the outer
         translate/skew, so GSAP only ever touches .pf-float) */
      const floats = gsap.utils.toArray(".pf-float");
      if (floats.length) {
        const float = gsap.to(floats, {
          y: -6,
          duration: 1.9,
          ease: "sine.inOut",
          yoyo: true,
          repeat: -1,
          stagger: { each: 0.28, repeat: -1, yoyo: true },
          paused: true,
        });
        ScrollTrigger.create({
          trigger: "#portfolio",
          start: "top 85%",
          end: "bottom 15%",
          onToggle: (self) => (self.isActive ? float.play() : float.pause()),
        });
      }

      /* Scroll progress bar */
      gsap.to("#scroll-progress", {
        scaleX: 1,
        ease: "none",
        scrollTrigger: { start: 0, end: "max", scrub: 0.3 },
      });

      ScrollTrigger.refresh();
    });

    return () => mm.revert();
  }, []);

  return (
    <div>
      <div id="scroll-progress" aria-hidden="true"></div>
      <Nav activeSection={activeSection} />
      <ShaderIntro />
      <Hero />
      <Resume />
      <Portfolio />
      <Contact />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
